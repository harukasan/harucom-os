name: Test

on:
  push:
    branches: [ "main" ]
  # No branch filter: a pull request stacked on another branch needs testing
  # just as much as one against main, and with a filter it silently gets none.
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # libssl-dev links the test VM (stdlib gembox), libfreetype-dev
    # builds the freetype gem from the Gemfile.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libfreetype-dev

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.1'
        bundler-cache: true

    - name: Run host tests
      run: bundle exec rake test

    # The shell's own tests need neither emcc nor a wasm build, so they are the
    # half of the browser suite CI can afford to run on every push.
    - name: Test the browser shell
      run: bundle exec rake wasm:ui_test
