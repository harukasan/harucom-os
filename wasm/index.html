<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harucom OS (wasm)</title>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <!-- The shell renders here. The DVI canvas and the console buffer are created
       by ui/main.js rather than written here, because the print handlers have to
       be in place before the module is constructed to catch what harucom_init
       prints. -->
  <div id="app"></div>

  <!-- harucom.js (classic script) defines the global createHarucomModule
       factory; ui/main.js (ES module) boots the VM and renders the shell. -->
  <script src="harucom.js"></script>
  <script type="module" src="ui/main.js"></script>
</body>
</html>
